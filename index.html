<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>供应链运营分析看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei","PingFang SC",sans-serif; color: #1a1a2e; background: #f4f5f9; padding: 16px; }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: #888; margin-bottom: 16px; }
  .nav-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab { padding: 7px 18px; border: 1px solid #ddd; border-radius: 20px; cursor: pointer; font-size: 13px; background: #fff; transition: all .2s; }
  .tab.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .filter-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-row select, .filter-row input { padding: 5px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: #fff; border-radius: 10px; padding: 14px; text-align: center; }
  .kpi .label { font-size: 11px; color: #888; }
  .kpi .value { font-size: 22px; font-weight: 700; color: #1a1a2e; margin: 4px 0; }
  .kpi .delta { font-size: 11px; }
  .delta.up { color: #dc2626; }
  .delta.down { color: #059669; }
  .delta.warn { color: #d97706; }
  .section { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .section h2 { font-size: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .section h2 .hint { font-size: 11px; color: #999; font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; padding: 8px 6px; border-bottom: 2px solid #e5e7eb; color: #6b7280; font-weight: 600; font-size: 11px; }
  td { padding: 7px 6px; border-bottom: 1px solid #f3f4f6; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.red { background: #fee2e2; color: #dc2626; }
  .badge.yellow { background: #fef3c7; color: #d97706; }
  .badge.green { background: #d1fae5; color: #059669; }
  .badge.gray { background: #f3f4f6; color: #6b7280; }
  .bar-wrap { width: 60px; height: 6px; background: #e5e7eb; border-radius: 3px; display: inline-block; vertical-align: middle; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .alert-box { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .alert-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .chart-row { display: flex; gap: 16px; }
  .chart-row .section { flex: 1; }
  svg { display: block; }
  .footer { text-align: center; font-size: 11px; color: #999; margin-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <h1>供应链运营分析看板</h1>
  <div class="subtitle">演示数据按真实供应链运营月报字段结构自建 · 原生 JS + SVG 零依赖单文件</div>

  <div class="nav-tabs">
    <div class="tab active" onclick="switchTab('overview')">运营总览</div>
    <div class="tab" onclick="switchTab('sku')">SKU 周转分析</div>
    <div class="tab" onclick="switchTab('supplier')">供应商交付</div>
  </div>

  <div class="filter-row">
    <select id="f-cat"><option value="">全品类</option><option>数码</option><option>家居</option><option>食品</option></select>
    <select id="f-warehouse"><option value="">全仓库</option><option>华东仓</option><option>华南仓</option><option>华北仓</option></select>
    <select id="f-alert"><option value="">全部状态</option><option>缺货</option><option>滞销</option><option>正常</option></select>
    <input type="text" id="f-search" placeholder="搜索 SKU 名称…" style="width:180px;">
    <button onclick="applyFilters()" style="padding:5px 14px;border:1px solid #ddd;border-radius:6px;font-size:12px;cursor:pointer;background:#fff;">筛选</button>
    <button onclick="exportCSV()" style="padding:5px 14px;border:1px solid #ddd;border-radius:6px;font-size:12px;cursor:pointer;background:#fff;">导出 CSV</button>
  </div>

  <!-- ========== Tab: 运营总览 ========== -->
  <div id="tab-overview" class="tab-content">
    <div class="kpi-grid" id="kpi-grid"></div>

    <div class="section">
      <h2>智能诊断预警 <span class="hint">基于周转/缺货率/供应商准时率自动判定</span></h2>
      <div id="alerts"></div>
    </div>

    <div class="chart-row">
      <div class="section">
        <h2>12 周库存金额趋势 <span class="hint">万元</span></h2>
        <svg id="chart-inventory" width="500" height="180"></svg>
      </div>
      <div class="section">
        <h2>ABC 分类分布 <span class="hint">按销售额贡献</span></h2>
        <svg id="chart-abc" width="320" height="180"></svg>
      </div>
    </div>
  </div>

  <!-- ========== Tab: SKU 周转 ========== -->
  <div id="tab-sku" class="tab-content" style="display:none;">
    <div class="section">
      <h2>SKU 周转与库存分析 <span class="hint">红色=滞销(>45天) / 黄色=偏低(<7天) / 绿色=正常</span></h2>
      <table id="sku-table"><thead></thead><tbody></tbody></table>
    </div>
  </div>

  <!-- ========== Tab: 供应商 ========== -->
  <div id="tab-supplier" class="tab-content" style="display:none;">
    <div class="section">
      <h2>供应商交付绩效 <span class="hint">准时率 < 85% 红色预警建议切换备选</span></h2>
      <table id="supplier-table"><thead></thead><tbody></tbody></table>
    </div>
  </div>

  <div class="footer">供应链运营分析看板 · 演示数据集 · github.com/46bzvs7m64-gif/supply-dashboard</div>
</div>

<script>
// ========== 演示数据（按真实供应链字段结构自建）==========
const SKUS = [
  {sku:"SP-001",name:"蓝牙耳机 Pro",cat:"数码",wh:"华东仓",sales28:4200,stock:1850,intransit:600,supplier:"恒达电子",ontime:92},
  {sku:"SP-002",name:"无线充电板",cat:"数码",wh:"华东仓",sales28:2800,stock:320,intransit:200,supplier:"恒达电子",ontime:88},
  {sku:"SP-003",name:"智能手环",cat:"数码",wh:"华南仓",sales28:3600,stock:60,intransit:500,supplier:"中芯微",ontime:79},
  {sku:"SP-004",name:"USB-C 数据线",cat:"数码",wh:"华北仓",sales28:8500,stock:4200,intransit:1000,supplier:"中芯微",ontime:91},
  {sku:"SP-005",name:"北欧风落地灯",cat:"家居",wh:"华东仓",sales28:450,stock:1200,intransit:0,supplier:"光禾家居",ontime:94},
  {sku:"SP-006",name:"记忆棉枕芯",cat:"家居",wh:"华南仓",sales28:680,stock:2100,intransit:300,supplier:"光禾家居",ontime:90},
  {sku:"SP-007",name:"不锈钢保温杯",cat:"家居",wh:"华北仓",sales28:1200,stock:340,intransit:800,supplier:"膳品",ontime:96},
  {sku:"SP-008",name:"坚果礼盒装",cat:"食品",wh:"华东仓",sales28:3200,stock:180,intransit:600,supplier:"三只松",ontime:83},
  {sku:"SP-009",name:"冻干咖啡",cat:"食品",wh:"华南仓",sales28:950,stock:2800,intransit:0,supplier:"三只松",ontime:87},
  {sku:"SP-010",name:"手冲滤纸",cat:"食品",wh:"华北仓",sales28:1100,stock:520,intransit:400,supplier:"三只松",ontime:89},
  {sku:"SP-011",name:"机械键盘",cat:"数码",wh:"华东仓",sales28:1800,stock:50,intransit:300,supplier:"恒达电子",ontime:91},
  {sku:"SP-012",name:"桌面台灯",cat:"家居",wh:"华南仓",sales28:380,stock:1500,intransit:0,supplier:"光禾家居",ontime:95},
  {sku:"SP-013",name:"速食燕麦",cat:"食品",wh:"华北仓",sales28:2200,stock:260,intransit:800,supplier:"三只松",ontime:82},
  {sku:"SP-014",name:"蓝牙音箱",cat:"数码",wh:"华南仓",sales28:1600,stock:480,intransit:200,supplier:"中芯微",ontime:78},
  {sku:"SP-015",name:"收纳整理箱",cat:"家居",wh:"华东仓",sales28:520,stock:2400,intransit:0,supplier:"光禾家居",ontime:93},
];

const INVENTORY_12W = [520,580,610,590,640,680,710,690,730,760,740,780];
const SUPPLIERS = [
  {name:"恒达电子",total:28,ontime:26,rate:93,revenue:1250000,reject:1.2},
  {name:"中芯微",total:22,ontime:19,rate:86,revenue:890000,reject:2.1},
  {name:"光禾家居",total:18,ontime:17,rate:94,revenue:560000,reject:0.8},
  {name:"膳品",total:12,ontime:12,rate:100,revenue:340000,reject:0.5},
  {name:"三只松",total:25,ontime:21,rate:84,revenue:980000,reject:1.8},
];

// ========== 计算函数 ==========
function calcSku(s) {
  const dailyAvg = s.sales28 / 28;
  const turnoverDays = dailyAvg > 0 ? Math.round(s.stock / dailyAvg) : 999;
  const stockoutRisk = dailyAvg > 0 ? Math.round((s.stock / (s.stock + s.intransit)) * 100) : 0;
  let status = "正常", cls = "green";
  if (turnoverDays > 45) { status = "滞销"; cls = "red"; }
  else if (turnoverDays < 7) { status = "偏低"; cls = "yellow"; }
  const stockoutRate = dailyAvg > 0 ? Math.max(0, Math.round((1 - s.stock / (dailyAvg * 14)) * 100)) : 0;
  return { ...s, dailyAvg: dailyAvg.toFixed(1), turnoverDays, stockoutRisk, status, cls, stockoutRate };
}
function calcAll() { return SKUS.map(calcSku); }

// ========== Tab 切换 ==========
function switchTab(tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");
  document.querySelectorAll(".tab-content").forEach(c => c.style.display = "none");
  document.getElementById("tab-" + tab).style.display = "block";
  if (tab === "overview") renderOverview();
  if (tab === "sku") renderSkuTable();
  if (tab === "supplier") renderSupplierTable();
}

// ========== 筛选 ==========
function applyFilters() {
  // 简单实现：在 SKU 表格中过滤
  const cat = document.getElementById("f-cat").value;
  const wh = document.getElementById("f-warehouse").value;
  const search = document.getElementById("f-search").value.toLowerCase();
  const filtered = SKUS.filter(s =>
    (!cat || s.cat === cat) &&
    (!wh || s.wh === wh) &&
    (!search || s.name.toLowerCase().includes(search))
  );
  renderSkuTable(filtered);
  renderOverview(filtered);
  renderSupplierTable(filtered);
}
function exportCSV() {
  const rows = calcAll();
  const headers = ["SKU","名称","品类","仓库","日均销量","库存","在途","周转天数","缺货率","状态","供应商"];
  const csv = [headers.join(",")];
  rows.forEach(r => {
    csv.push([r.sku,r.name,r.cat,r.wh,r.dailyAvg,r.stock,r.intransit,r.turnoverDays,r.stockoutRate+"%",r.status,r.supplier].join(","));
  });
  const blob = new Blob(["\ufeff" + csv.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "供应链SKU分析.csv";
  a.click();
}

// ========== 渲染：总览 ==========
function renderOverview() {
  const data = calcAll();
  const totalStockValue = data.reduce((a, b) => a + b.stock * 50, 0); // 假设均价 50
  const avgTurnover = Math.round(data.reduce((a, b) => a + b.turnoverDays, 0) / data.length);
  const stockoutCount = data.filter(s => s.turnoverDays < 7).length;
  const slowCount = data.filter(s => s.turnoverDays > 45).length;
  const avgOntime = Math.round(SUPPLIERS.reduce((a, b) => a + b.rate, 0) / SUPPLIERS.length);

  const kpis = [
    { label: "总库存金额", value: (totalStockValue / 10000).toFixed(1) + "万", delta: "+5.2% vs 上周", cls: "up" },
    { label: "平均周转天数", value: avgTurnover + "天", delta: avgTurnover > 30 ? "偏高" : "正常", cls: avgTurnover > 30 ? "warn" : "down" },
    { label: "缺货预警 SKU", value: stockoutCount, delta: stockoutCount > 2 ? "需立即补货" : "可控", cls: stockoutCount > 2 ? "up" : "down" },
    { label: "滞销 SKU", value: slowCount, delta: slowCount > 0 ? "建议清仓" : "无", cls: slowCount > 0 ? "warn" : "down" },
    { label: "供应商平均准时率", value: avgOntime + "%", delta: avgOntime < 85 ? "偏低" : "正常", cls: avgOntime < 85 ? "warn" : "down" },
  ];
  document.getElementById("kpi-grid").innerHTML = kpis.map(k =>
    `<div class="kpi"><div class="label">${k.label}</div><div class="value">${k.value}</div><div class="delta ${k.cls}">${k.delta}</div></div>`
  ).join("");

  // 智能诊断预警
  const alerts = [];
  data.filter(s => s.turnoverDays < 7).forEach(s => {
    alerts.push({ dot: "#dc2626", text: `<b>${s.name}</b>（${s.sku}）库存仅够 ${s.turnoverDays} 天，建议<b>立即补货</b>，在途 ${s.intransit} 件` });
  });
  data.filter(s => s.turnoverDays > 45).forEach(s => {
    alerts.push({ dot: "#d97706", text: `<b>${s.name}</b>（${s.sku}）周转 ${s.turnoverDays} 天，滞销库存 ${s.stock} 件，建议<b>清仓促销</b>或停采` });
  });
  SUPPLIERS.filter(s => s.rate < 85).forEach(s => {
    alerts.push({ dot: "#dc2626", text: `供应商 <b>${s.name}</b> 准时率 ${s.rate}%（${s.ontime}/${s.total}），低于 85% 阈值，建议<b>切换备选供应商</b>` });
  });
  if (alerts.length === 0) {
    document.getElementById("alerts").innerHTML = '<div style="color:#999;font-size:12px;padding:10px;">暂无预警</div>';
  } else {
    document.getElementById("alerts").innerHTML = alerts.map(a =>
      `<div class="alert-box"><div class="alert-dot" style="background:${a.dot}"></div>${a.text}</div>`
    ).join("");
  }

  // 12周库存趋势
  drawLineChart("chart-inventory", INVENTORY_12W, 520, 780, "#dc2626");
  // ABC 分类
  drawAbcChart("chart-abc", data);
}

// ========== 渲染：SKU 表格 ==========
function renderSkuTable(list) {
  const data = (list || SKUS).map(calcSku);
  const headers = ["SKU","名称","品类","仓库","日均销量","库存","在途","周转天数","缺货率","状态","供应商","准时率"];
  document.querySelector("#sku-table thead").innerHTML = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";
  document.querySelector("#sku-table tbody").innerHTML = data.map(r => `
    <tr>
      <td>${r.sku}</td><td>${r.name}</td><td>${r.cat}</td><td>${r.wh}</td>
      <td>${r.dailyAvg}</td><td>${r.stock}</td><td>${r.intransit}</td>
      <td><span class="badge ${r.cls}">${r.turnoverDays}天</span></td>
      <td>${r.stockoutRate}%</td>
      <td><span class="badge ${r.cls}">${r.status}</span></td>
      <td>${r.supplier}</td>
      <td><span class="bar-wrap"><span class="bar-fill" style="width:${r.ontime}%;background:${r.ontime<85?'#dc2626':'#059669'}"></span></span> ${r.ontime}%</td>
    </tr>
  `).join("");
}

// ========== 渲染：供应商表格 ==========
function renderSupplierTable() {
  const headers = ["供应商","总单数","准时交付","准时率","采购额(元)","不良率","状态"];
  document.querySelector("#supplier-table thead").innerHTML = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";
  document.querySelector("#supplier-table tbody").innerHTML = SUPPLIERS.map(s => {
    const cls = s.rate >= 90 ? "green" : s.rate >= 85 ? "yellow" : "red";
    const status = s.rate >= 90 ? "优秀" : s.rate >= 85 ? "关注" : "预警";
    return `<tr>
      <td><b>${s.name}</b></td><td>${s.total}</td><td>${s.ontime}</td>
      <td><span class="badge ${cls}">${s.rate}%</span></td>
      <td>${s.revenue.toLocaleString()}</td><td>${s.reject}%</td>
      <td><span class="badge ${cls}">${status}</span></td>
    </tr>`;
  }).join("");
}

// ========== SVG 图表 ==========
function drawLineChart(id, data, min, max, color) {
  const el = document.getElementById(id);
  const w = el.getAttribute("width"), h = el.getAttribute("height");
  const pad = { l: 40, r: 15, t: 15, b: 25 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  const stepX = cw / (data.length - 1);
  const points = data.map((v, i) => `${pad.l + i * stepX},${pad.t + ch - ((v - min) / (max - min)) * ch}`).join(" ");
  const bars = data.map((v, i) => {
    const x = pad.l + i * stepX - 6;
    const y = pad.t + ch - ((v - min) / (max - min)) * ch;
    return `<rect x="${x}" y="${y}" width="12" height="${pad.t + ch - y}" fill="${color}" opacity="0.15"/>`;
  }).join("");
  el.innerHTML = `
    <line x1="${pad.l}" y1="${pad.t+ch}" x2="${pad.l+cw}" y2="${pad.t+ch}" stroke="#e5e7eb"/>
    <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+ch}" stroke="#e5e7eb"/>
    <text x="${pad.l-5}" y="${pad.t+8}" text-anchor="end" font-size="10" fill="#999">${max}</text>
    <text x="${pad.l-5}" y="${pad.t+ch+3}" text-anchor="end" font-size="10" fill="#999">${min}</text>
    ${bars}
    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2"/>
    ${data.map((v, i) => `<circle cx="${pad.l + i * stepX}" cy="${pad.t + ch - ((v - min) / (max - min)) * ch}" r="3" fill="${color}"/>`).join("")}
    ${data.map((v, i) => i % 2 === 0 ? `<text x="${pad.l + i * stepX}" y="${h - 5}" text-anchor="middle" font-size="9" fill="#999">W${i + 1}</text>` : "").join("")}
  `;
}

function drawAbcChart(id, data) {
  const el = document.getElementById(id);
  const w = 320, h = 180;
  const sorted = [...data].sort((a, b) => (b.sales28 * 50) - (a.sales28 * 50));
  const totalRev = sorted.reduce((a, b) => a + b.sales28 * 50, 0);
  let cumPct = 0;
  const cats = sorted.map(s => {
    const pct = (s.sales28 * 50 / totalRev * 100);
    cumPct += pct;
    let cls = cumPct <= 70 ? "A" : cumPct <= 90 ? "B" : "C";
    return { ...s, pct, cum: cumPct, cls };
  });
  const aCount = cats.filter(c => c.cls === "A").length;
  const bCount = cats.filter(c => c.cls === "B").length;
  const cCount = cats.filter(c => c.cls === "C").length;
  const colors = { A: "#dc2626", B: "#d97706", C: "#059669" };
  const barW = 18, gap = 4, startX = 40;
  const maxH = h - 40;
  el.innerHTML = `
    <text x="${w/2}" y="15" text-anchor="middle" font-size="11" fill="#888">A类(高价值): ${aCount}个 | B类(中): ${bCount}个 | C类(低): ${cCount}个</text>
    ${cats.map((c, i) => {
      const bh = Math.max(2, (c.pct / 30) * maxH);
      const x = startX + i * (barW + gap);
      return `<rect x="${x}" y="${h - 15 - bh}" width="${barW}" height="${bh}" fill="${colors[c.cls]}" rx="2"/>
              <text x="${x + barW/2}" y="${h - 3}" text-anchor="middle" font-size="8" fill="#999">${i+1}</text>`;
    }).join("")}
    <text x="${startX}" y="${h-15-maxH-2}" font-size="9" fill="#dc2626">■ A类(≤70%)</text>
    <text x="${startX+90}" y="${h-15-maxH-2}" font-size="9" fill="#d97706">■ B类(70-90%)</text>
    <text x="${startX+180}" y="${h-15-maxH-2}" font-size="9" fill="#059669">■ C类(>90%)</text>
  `;
}

// 初始化
renderOverview();
</script>
</body>
</html>
